spring.application.name=act4t4
server.port=8086

# Base de datos (credenciales por variables de entorno)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:act4_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT (el secreto debe tener minimo 32 caracteres; en la VPS se cambia por variable de entorno)
app.jwt.secret=${JWT_SECRET:clave-secreta-para-desarrollo-act4t4-no-usar-en-produccion-123456}
app.jwt.expiracion-ms=${JWT_EXPIRACION_MS:3600000}